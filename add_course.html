<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إضافة كورس</title>
</head>

<body>

<h1>إضافة كورس جديد</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="title"
        placeholder="اسم الكورس"
        required>

    <br><br>

    <textarea
        name="description"
        placeholder="وصف الكورس"
        required></textarea>

    <br><br>

    <input
        type="number"
        name="price"
        placeholder="السعر"
        required>

    <br><br>

    <label>صورة الكورس</label>

    <br>

    <input
        type="file"
        name="image"
        accept="image/*"
        required>

    <br><br>

    <button type="submit">
        حفظ الكورس
    </button>

</form>

</body>

</html>
