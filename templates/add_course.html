د<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إضافة كورس</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>➕ إضافة كورس جديد</h1>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="text"
            name="title"
            placeholder="اسم الكورس"
            required>

        <br><br>

        <textarea
            name="description"
            placeholder="وصف الكورس"
            rows="6"
            required></textarea>

        <br><br>

        <input
            type="number"
            name="price"
            placeholder="سعر الكورس"
            required>

        <br><br>

        <input
            type="file"
            name="image"
            accept="image/*"
            required>

        <br><br>

        <button type="submit">
            حفظ الكورس
        </button>

    </form>

    <br>

    <a href="/teacher">
        العودة للوحة المدرس
    </a>

</div>

</body>

</html>
