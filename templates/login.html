<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>تسجيل الدخول</h1>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="البريد الإلكتروني"
            required>

        <input
            type="password"
            name="password"
            placeholder="كلمة المرور"
            required>

        <button type="submit">
            تسجيل الدخول
        </button>

    </form>

    <br>

    <a href="/register">
        إنشاء حساب جديد
    </a>

</div>

</body>

</html>
